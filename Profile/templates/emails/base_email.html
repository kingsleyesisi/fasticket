<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .header {
            background-color: #2563eb;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: bold;
            margin: 0;
        }
        .main {
            padding: 20px;
        }
        .footer {
            background-color: #f3f4f6;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #6b7280;
        }
        .footer p {
            margin: 5px 0;
        }
    </style>
</head>
    <body>
    <div class="container">
        <header class="header">
            <h1>{{ subject }}</h1>
        </header>
        <main class="main">
            {% block content %} {% endblock %}
        </main>
        <footer class="footer">
            <p style="color: #374151; font-weight: bold; margin: 10px 0;">Fastickets Team</p>
        </footer>
    </div>
</body>
</html>
